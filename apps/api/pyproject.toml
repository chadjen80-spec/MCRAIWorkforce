[project]
name = "mcr-ai-workforce-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "boto3>=1.44.4",
    "celery>=5.7.0",
    "cryptography>=50.0.2",
    "fastapi>=0.163.2",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.8.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.34",
    "pywin32>=312 ; sys_platform == 'win32'",
    "redis>=8.1.0",
    "reportlab>=5.1.0",
    "segno>=1.6",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ['ignore:Dialect sqlite.pysqlite does .not. support Decimal']

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S105", "S106"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
